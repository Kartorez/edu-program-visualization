version: '3'

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: edu_program
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edu_user -d edu_program']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
